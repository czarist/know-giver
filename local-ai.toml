# NeMo-Speech.cpp runs NVIDIA's speech models from GGUF files. The app starts
# `nemo-speech serve` on 127.0.0.1 for the Nemotron speech recognition test.
# `file` is the CPU build; `gpu_file` the Vulkan (Windows, Linux) or Metal (Apple
# silicon) build, tried first with a fallback to the CPU one.
[nemo_speech]
repository = "https://github.com/NVIDIA/NeMo-Speech.cpp"
version = "v0.3.0"
commit = "20999cc921d2b14aa58708f61756a8b2e787ba20"
license = "Apache-2.0"

