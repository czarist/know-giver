<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Know Giver mark: an open book inside a speech bubble. Study + conversation. -->
  <!-- Bubble with a tail at the bottom left -->
  <path d="M15 6 H49 A11 11 0 0 1 60 17 V39 A11 11 0 0 1 49 50 H26 L13.5 59.5 A1.2 1.2 0 0 1 11.6 58.5 L13 50 H15 A11 11 0 0 1 4 39 V17 A11 11 0 0 1 15 6 Z"
        fill="#2F6F68"/>
  <!-- Open book: two pages rising to the outer corners, meeting at the spine -->
  <path d="M32 17.5 C27 14.5 20.5 14 14 15.5 V40 C20.5 38.5 27 39 32 42 Z" fill="#F6F4EF"/>
  <path d="M32 17.5 C37 14.5 43.5 14 50 15.5 V40 C43.5 38.5 37 39 32 42 Z" fill="#F6F4EF"/>
  <path d="M32 17.5 V42" stroke="#2F6F68" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Text lines on the left page -->
  <path d="M18 22 C21.5 21.3 24.5 21.4 28 22.4" stroke="#9DBDB7" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M18 27 C21.5 26.3 24.5 26.4 28 27.4" stroke="#9DBDB7" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M18 32 C21.5 31.3 24.5 31.4 28 32.4" stroke="#9DBDB7" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Spoken words on the right page, in the warm accent -->
  <path d="M36 22.4 C39.5 21.4 42.5 21.3 46 22" stroke="#C98A2B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M36 27.4 C38.5 26.7 40.5 26.6 42.5 26.9" stroke="#C98A2B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
</svg>
